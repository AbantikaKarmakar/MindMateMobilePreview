return`<button class="btn g s" data-a="go" data-v="home">‹ Home</button><h1 style="margin-top:1rem">Workload overview</h1><div class="card"><label for="cap">Daily study hours available</label><input id="cap" type="number" min="1" max="16" step="0.5" value="${w.A}" data-f="cap" style="max-width:120px"><p class="mut">Rule: for each open task, remaining hours R ÷ days left D (at least 1) = r. Demand on a day = sum of r for tasks due on or after it. Ratio = demand ÷ capacity: below 0.75 manageable, 0.75 to 1.00 busy, above 1.00 exceeds entered hours. These thresholds are assumptions, and the flags describe planned work only.</p></div>
<div class="card"><h2>Next 7 days</h2>${w.days.map(d=>`<div class="row" style="margin:.3rem 0"><span style="width:60px">${fmt(d.date)}</span><div class="bar"><i class="b${d.band}" style="width:${Math.min(100,d.ratio*100)}%"></i></div><span class="mut" style="min-width:210px">${d.dem.toFixed(1)}h · <span class="tag t${d.band}">${BAND[d.band]}</span></span></div>`).join('')}</div>
${heat()}<div class="card"><h2>Hours left by subject</h2>${subj(w)}</div>${planv(w)}<div class="card"><h2>Suggestions</h2>${vis.map(s=>`<div class="task"><div class="tt">${s[1]}</div><button class="btn s" data-a="${s[3]}" data-id="${s[4]}" data-v="${s[4]}">${s[2]}</button><button class="btn s g" data-a="dis" data-v="${s[0]}">Dismiss</button></div>`).join('')||'<p class="mut">No suggestions right now. You decide whether to follow any of them.</p>'}</div>
<div class="card"><h2>Priority order and reasons</h2>${w.items.map((x,i)=>`<div class="task"><div class="tt"><button class="l" data-a="open" data-id="${x.t.id}">${i+1}. ${esc(x.t.title)}</button><div class="mut">${dueTxt(x.t)} · ${PRI[x.t.pri]} importance</div><details><summary>Why this ranking?</summary>${why(x)}</details></div></div>`).join('')||'<p class="mut">No open tasks with estimates.</p>'}</div>`},
progress(){const dn=S.tasks.filter(t=>t.done),open=S.tasks.length-dn.length,ot=dn.filter(t=>(t.doneOn||t.due)<=t.due).length,od=S.tasks.filter(t=>!t.done&&diff(t.due)<0).length,ss=S.tasks.flatMap(t=>t.subs),sd=ss.filter(s=>s.d).length;
const wk=[...Array(7)].map((_,i)=>({d:add(i-6),n:dn.filter(t=>t.doneOn==add(i-6)).length})),mx=Math.max(1,...wk.map(x=>x.n)),cs=[...new Set(S.tasks.map(t=>t.course))];

return`<h1>Progress</h1>${JOURNEY([true,dn.length>0,(S.fs||[]).length>0,S.tasks.length>0&&!open])}<div class="grid"><div class="card"><h2>${dn.length} done, ${open} open</h2><p>On-time completion: <b>${dn.length?Math.round(ot/dn.length*100)+'%':'no data'}</b></p><p>Overdue now: <b>${od}</b></p><p>Steps completed: <b>${ss.length?sd+'/'+ss.length:'none planned'}</b></p></div>
<div class="card"><h2>Completed this week</h2>${wk.map(x=>`<div class="row" style="margin:.2rem 0"><span style="width:56px" class="mut">${fmt(x.d)}</span><div class="bar"><i style="width:${x.n/mx*100}%"></i></div><b>${x.n}</b></div>`).join('')}</div></div>
<div class="card" style="margin-top:1rem"><h2>By course</h2>${cs.map(c=>{const a=S.tasks.filter(t=>t.course==c),b=a.filter(t=>t.done).length;return`<div class="row" style="margin:.3rem 0"><span style="width:130px">${esc(c)}</span><div class="bar"><i style="width:${b/a.length*100}%"></i></div><span class="mut">${b}/${a.length}</span></div>`}).join('')||'<p class="mut">No tasks yet.</p>'}<p><button class="btn s g" data-a="go" data-v="measures">See how this maps to the report’s KPIs</button></p><p class="mut">Sample history is demo data. These figures describe task activity only. They do not measure wellbeing or prove improvement.</p></div>

resources(){const sv=S.saved;if(V.rid){const r=RES.find(x=>x.id==V.rid),dn=S.rdone.includes(r.id);return`<button class="btn g s" data-a="ro">‹ Back to resources</button><div class="card" style="margin-top:1rem"><h1>${r.t}</h1><p class="mut">${r.c} · about ${r.m} min</p><p>${r.b}</p>${r.id=='r2'?`<div class="br" style="animation-delay:-${Date.now()%16000}ms" aria-hidden="true"></div><p id="bt" role="status" style="text-align:center;font-weight:600">Breathe in</p>`:''}<p class="mut"><b>Purpose and limits:</b> general, self-guided information. It is not therapy or treatment and does not diagnose or treat any condition. For personal support, contact qualified professionals.</p><div class="row"><button class="btn" data-a="rdone" data-id="${r.id}">${dn?'Completed ✓ (tap to undo)':'Mark as done'}</button><button class="btn g" data-a="rsave" data-id="${r.id}" aria-pressed="${sv.includes(r.id)}">${sv.includes(r.id)?'Saved ✓':'Save for later'}</button></div></div>`}
